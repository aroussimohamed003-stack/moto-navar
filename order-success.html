<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <title>Order confirmed – MOTO NAVAR</title>
  <meta name="robots" content="noindex">
</head>
<body>
<header id="site-header"></header>
<main class="checkout-page" style="max-width:640px">
  <div class="card success-panel">
    <div class="success-panel__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg></div>
    <h1 class="auth__title">Thank you!</h1>
    <p class="auth__subtitle">Your order <b id="ref"></b> has been received. We'll call you to confirm delivery. Payment is cash on delivery.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="account.html#orders">Track my order</a>
      <a class="btn btn--ghost" href="shop.html">Continue shopping</a>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="assets/js/site-header.js"></script>
<script>document.getElementById("ref").textContent = "#" + (new URLSearchParams(location.search).get("id") || "").slice(0, 8).toUpperCase();</script>
</body>
</html>
